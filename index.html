<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c2acb">
  <title>Mushland Store</title>
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.4.1/bundles/skinview3d.bundle.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root {
      --bg: #f8f7fb;
      --panel: #ffffff;
      --line: #e9e5f1;
      --ink: #292444;
      --muted: #7f7a8c;
      --purple: #7136c8;
      --dark-purple: #3b216d;
      --pink: #ff87b8;
      --success: #66cf8b;
      --danger: #b43d59;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; background: var(--bg); color: var(--ink); font-family: 'DM Sans', sans-serif; }
    body { min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    #app { min-height: 100vh; display: flex; }

    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: 265px; height: 100vh; padding: 30px 20px;
      background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 20;
    }
    .profile { display: flex; justify-content: center; padding: 0 5px 24px; }
    .logo-avatar { width: 160px; height: 160px; object-fit: contain; margin: -20px 0 -20px; }
    .side-rule { height: 1px; background: var(--line); margin: 0 5px 30px; }
    .menu-label, .eyebrow { color: #a6a1b2; font-size: 10px; letter-spacing: 1.4px; font-weight: 700; margin: 0 10px 12px; }
    .nav-list { display: grid; gap: 8px; }
    .nav-item {
      border: 0; background: transparent; border-radius: 11px; color: #5b5672; text-align: left; padding: 13px 14px;
      font-weight: 600; display: flex; align-items: center; gap: 14px;
    }
    .nav-item:hover { background: #f7f1ff; color: var(--purple); }
    .nav-item.active { background: var(--dark-purple); color: #fff; box-shadow: 0 9px 20px rgba(59, 33, 109, 0.3); }
    .nav-item.active .nav-icon { color: #e2caff; }
    .nav-icon { width: 21px; flex: 0 0 21px; display: grid; place-items: center; text-align: center; color: #a36df2; font-size: 19px; }
    .nav-icon-image { display: block; width: 21px; height: 21px; object-fit: contain; image-rendering: pixelated; }

    .sidebar-player { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 18px; }
    .player-preview {
      position: relative; width: 108px; height: 132px; display: grid; place-items: center;
      border-radius: 12px; background: rgba(122, 90, 190, 0.08);
    }
    .player-preview canvas { width: 108px; height: 132px; display: block; }
    .skin-fallback {
      position: absolute; inset: 24px 20px; display: grid; place-items: center; border: 3px solid #20233d;
      border-radius: 5px; color: #26395b; background: linear-gradient(#6f472c 0 22%, #e7a66d 22% 100%);
      box-shadow: 0 7px 0 #323650; font-size: 28px; font-weight: 700;
    }
    .player-preview:not(.fallback) .skin-fallback { display: none; }
    .user-button {
      width: 100%; border: 1px solid #8451d5; border-radius: 9px; padding: 11px 14px; color: #fff;
      background: linear-gradient(135deg, #8d4ee0, #5b279f); box-shadow: 0 7px 16px rgba(91, 39, 159, 0.3);
      font-size: 13px; font-weight: 700;
    }
    .account-menu {
      position: absolute; top: calc(100% + 8px); right: 0; width: 170px; padding: 8px; border-radius: 9px;
      border: 1px solid var(--line); background: #fff; box-shadow: 0 12px 30px rgba(59, 33, 109, 0.15);
    }
    .account-menu[hidden] { display: none; }
    .account-menu p { margin: 5px 8px 8px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .logout-button {
      width: 100%; border: 0; border-radius: 6px; padding: 9px 8px; color: var(--danger); background: #fff1f4;
      font-size: 12px; font-weight: 700; text-align: left;
    }

    .sidebar-note {
      margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 11px; background: #faf7ff;
      border: 1px solid #eee6fb; color: inherit; text-decoration: none;
    }
    .sparkle { color: #8e55dd; font-size: 20px; }
    .sidebar-note strong, .sidebar-note small { display: block; }
    .sidebar-note small { color: var(--muted); margin-top: 3px; }

    .storefront { flex: 1; margin-left: 265px; display: flex; flex-direction: column; }

    .promo {
      min-height: 67px; display: flex; justify-content: center; align-items: center; gap: 18px; color: #fff;
      background: repeating-linear-gradient(125deg, #6d2ab6 0 34px, #7f3bca 34px 68px); font-size: 14px;
    }
    .promo-mark { color: #e6cfff; }

    .content {
      width: min(1060px, 100%); margin: 0 auto; padding: 52px 6vw 125px;
    }
    .page-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 34px; }
    .page-heading h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(38px, 5vw, 60px); line-height: 0.95; letter-spacing: -2px; }
    .subheading { margin: 13px 0 0; color: var(--muted); font-size: 14px; }
    .online { color: #5f5a72; font-size: 12px; display: flex; align-items: center; gap: 7px; }
    .online span { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }

    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
    .product-card {
      overflow: hidden; background: #fff; border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 9px 24px rgba(59, 33, 109, 0.04); animation: rise .5s both;
    }
    .product-art { position: relative; height: 185px; display: grid; place-items: center; overflow: hidden; }
    .product-art::before, .product-art::after {
      content: ''; position: absolute; width: 190px; height: 190px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.28);
    }
    .product-art::after { width: 270px; height: 270px; }
    .mint { background: linear-gradient(135deg, #b9e3da, #5d99ad); }
    .pink { background: linear-gradient(135deg, #f2b8d4, #b36cc5); }
    .blue { background: linear-gradient(135deg, #c6c5f5, #6671c8); }
    .purple { background: linear-gradient(135deg, #d4bbf5, #7653bd); }
    .gold { background: linear-gradient(135deg, #f4d595, #d68c92); }
    .violet { background: linear-gradient(135deg, #e2b5ec, #7443b2); }
    .pixel-sun { position: absolute; width: 72px; height: 72px; right: 33px; top: 20px; border-radius: 50%; background: rgba(255,255,255,0.72); }
    .pixel-mushroom { position: relative; z-index: 1; font-size: 75px; filter: drop-shadow(0 11px 3px rgba(51, 33, 86, 0.3)); }
    .rank-art-image { position: relative; z-index: 1; width: min(220px, 78%); max-height: 112px; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 11px 3px rgba(51, 33, 86, 0.3)); }
    .rank-icon-image { width: 34px; height: 24px; object-fit: contain; image-rendering: pixelated; }
    .art-label { position: absolute; left: 18px; bottom: 14px; color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px; }
    .product-info { padding: 19px; }
    .product-info h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 17px; }
    .product-info p { min-height: 38px; margin: 7px 0 17px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .card-bottom { display: flex; justify-content: space-between; align-items: center; }
    .card-bottom strong { color: var(--dark-purple); font-size: 18px; }
    .add-button {
      width: 34px; height: 34px; border: 0; border-radius: 9px; color: #fff; background: var(--purple); font-size: 24px; line-height: 1;
    }
    .rank-card { border-color: #e0e6eb; border-radius: 2px; box-shadow: 0 8px 24px rgba(30, 53, 75, 0.06); }
    .rank-card .product-art { height: 154px; background: #fff; overflow: visible; }
    .rank-card .product-art::before, .rank-card .product-art::after, .rank-card .pixel-sun, .rank-card .art-label { display: none; }
    .rank-icon-circle {
      position: relative; z-index: 1; width: 80px; height: 80px; display: grid; place-items: center;
      border-radius: 50%; background: #e7eef2;
    }
    .rank-icon-circle .rank-icon-image { width: 46px; height: 46px; }
    .rank-card .product-info { padding: 0 28px 27px; text-align: center; }
    .rank-card .product-info h2 { min-height: 44px; color: #102f58; font-size: 21px; }
    .rank-card .product-info p { display: none; }
    .rank-card .card-bottom { display: flex; flex-direction: column; gap: 30px; }
    .rank-card .card-bottom strong { color: #102f58; font-size: 16px; }
    .rank-card .add-button {
      width: 176px; height: 48px; border-radius: 6px; background: #16c45d; box-shadow: 0 7px 14px rgba(22, 196, 93, 0.22);
      font-size: 0; font-weight: 700; text-transform: uppercase;
    }
    .rank-card .add-button::before { content: '🛒'; margin-right: 12px; font-size: 20px; }
    .rank-card .add-button::after { content: 'Add to cart'; font-size: 12px; letter-spacing: .5px; }
    .rank-card .add-button:hover { background: #0eaa4d; transform: translateY(-2px); }
    .rank-nameplate-preview { margin-top: 30px; }
    .rank-nameplate-preview span { display: block; margin-bottom: 8px; color: #718096; font-size: 11px; font-weight: 700; }
    .rank-nameplate-preview img { display: block; width: min(220px, 100%); height: 32px; margin: 0 auto; object-fit: contain; image-rendering: pixelated; }
    .coming-soon { grid-column: 1 / -1; min-height: 280px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 2px; background: #fff; color: var(--dark-purple); font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 700; }

    .cart-bar {
      position: fixed; bottom: 0; left: 265px; right: 0; z-index: 15; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px;
      min-height: 82px; padding: 14px 32px; background: rgba(255,255,255,0.98); border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgba(36, 28, 70, 0.05); backdrop-filter: blur(14px);
    }
    .cart-total { display: flex; align-items: center; gap: 12px; }
    .cart-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--dark-purple); background: #eee5fb; font-size: 20px; }
    .cart-total small, .total-price small { display: block; color: #a6a1b2; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .cart-total strong { display: block; color: var(--dark-purple); }
    .total-price { text-align: left; }
    .total-price strong { color: var(--dark-purple); font-size: 18px; }
    .checkout-button {
      justify-self: end; min-width: 130px; border: 0; border-radius: 10px; padding: 13px 18px; background: linear-gradient(135deg, #9d6be0, #7136c8); color: #fff; font-weight: 700; box-shadow: 0 10px 20px rgba(113, 54, 200, 0.28); transition: transform .2s, filter .2s;
    }
    .checkout-button:hover:not([disabled]) { filter: brightness(1.08); transform: translateY(-2px); }
    .checkout-button[disabled] { background: #b99be5; box-shadow: none; opacity: 1; pointer-events: none; }

    .cart-drawer { position: fixed; inset: 0; z-index: 25; background: rgba(20, 39, 70, 0.4); }
    .cart-drawer[hidden] { display: none; }
    .cart-panel {
      position: absolute; top: 0; right: 0; width: min(390px, 100%); height: 100%; display: flex; flex-direction: column; padding: 28px 24px;
      background: #fff; box-shadow: -14px 0 36px rgba(20,39,70,0.15);
    }
    .cart-heading { display: flex; justify-content: space-between; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    .cart-heading h2 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; }
    .cart-close { border: 0; background: transparent; color: #6f6981; font-size: 25px; }
    .cart-items { flex: 1; overflow-y: auto; padding: 16px 0; }
    .cart-empty { padding: 40px 0; color: var(--muted); font-size: 13px; text-align: center; }
    .cart-item {
      display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f0edf4;
    }
    .cart-item-art {
      width: 52px; height: 52px; display: grid; place-items: center; border-radius: 9px; font-size: 26px; color: #fff;
      background: linear-gradient(135deg, #b69ae8, #7049ac);
    }
    .cart-item h3 { margin: 0 0 5px; font-size: 13px; font-family: 'Space Grotesk', sans-serif; }
    .cart-item-price { color: var(--dark-purple); font-size: 12px; font-weight: 700; }
    .quantity-controls { display: flex; align-items: center; gap: 7px; margin-top: 7px; }
    .quantity-controls button {
      width: 22px; height: 22px; border: 1px solid #ded6eb; border-radius: 5px; color: var(--purple); background: #faf8fd; line-height: 1;
    }
    .quantity-controls span { min-width: 14px; color: #615b73; font-size: 12px; text-align: center; }
    .remove-item { align-self: start; border: 0; color: var(--danger); background: transparent; font-size: 11px; }
    .cart-footer { padding-top: 16px; border-top: 1px solid var(--line); }
    .cart-footer-row { display: flex; justify-content: space-between; margin-bottom: 13px; color: #6f6981; font-size: 13px; }
    .clear-cart { width: 100%; border: 0; border-radius: 8px; padding: 10px 12px; background: #f5f1ff; color: var(--purple); font-weight: 700; }
    .checkout-start, .checkout-submit, .checkout-back, .success-close {
      border: 0; border-radius: 9px; padding: 12px 16px; font-weight: 700; cursor: pointer;
    }
    .checkout-start, .checkout-submit, .success-close {
      background: linear-gradient(135deg, #9d6be0, #7136c8); color: #fff; box-shadow: 0 10px 20px rgba(113, 54, 200, 0.22);
    }
    .checkout-back {
      background: #f3eefb; color: var(--dark-purple);
    }
    .checkout-form { display: grid; gap: 16px; padding-top: 18px; }
    .checkout-field { display: grid; gap: 8px; }
    .checkout-field label { color: #18365e; font-size: 11px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
    .checkout-field input {
      width: 100%; border: 1px solid #dfe5ee; border-radius: 8px; background: #f9fbff; color: #2b3850; padding: 12px 13px; font: inherit;
    }
    .checkout-summary { display: grid; gap: 10px; padding: 16px; border-radius: 10px; background: #f8f5ff; border: 1px solid #eee6fb; }
    .checkout-row, .checkout-total-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #5a5a72; font-size: 13px;
    }
    .checkout-total-row { padding-top: 10px; margin-top: 4px; border-top: 1px solid #eae0ff; color: #1d2840; font-weight: 700; }
    .checkout-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
    .checkout-actions .checkout-back { flex: 1; }
    .checkout-actions .checkout-submit { flex: 1.2; }
    .checkout-error { min-height: 18px; margin: 0; color: var(--danger); font-size: 12px; line-height: 1.45; }
    .checkout-success-modal {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(20,39,70,0.55);
    }
    .checkout-success-modal[hidden] { display: none; }
    .checkout-success-panel {
      width: min(420px, calc(100vw - 32px)); padding: 28px 24px 24px; border-radius: 14px; background: #fff; box-shadow: 0 24px 80px rgba(11, 24, 54, 0.32); text-align: center;
    }
    .success-icon { width: 62px; height: 62px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 50%; background: linear-gradient(135deg, #8fe0a8, #1eab60); color: #fff; font-size: 30px; font-weight: 800; }
    .checkout-success-panel h2 { margin: 0 0 8px; color: var(--dark-purple); font-family: 'Space Grotesk', sans-serif; }
    .checkout-success-panel p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .success-summary { display: grid; gap: 10px; margin: 20px 0 18px; padding: 14px 16px; border-radius: 10px; background: #f7f9ff; }
    .success-row { display: flex; justify-content: space-between; gap: 12px; color: #5a5a72; font-size: 13px; }
    .success-row strong { color: #1d2840; }
    .success-close { width: 100%; }

    .login-modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(20,39,70,0.6); }
    .login-modal[hidden] { display: none; }
    .login-panel {
      width: min(780px, calc(100vw - 40px)); background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 24px 70px rgba(11,24,54,0.4);
    }
    .login-top {
      display: grid; grid-template-columns: 90px minmax(0, 1fr) 150px; align-items: center; gap: 18px; padding: 28px 30px 32px; background: #fff;
    }
    .login-top h2 { grid-column: 1 / -1; margin: 0; color: #18365e; font-family: 'Space Grotesk', sans-serif; font-size: 19px; }
    .login-close { justify-self: end; border: 0; background: transparent; color: #18365e; font-size: 24px; }
    .login-avatar { width: 90px; height: 110px; display: grid; place-items: center; overflow: hidden; border-radius: 12px; background: #eef2f8; }
    .login-avatar canvas { width: 90px; height: 110px; display: block; }
    .steve-head {
      position: relative; width: 48px; height: 56px; border: 3px solid #20233d; border-radius: 5px;
      background: linear-gradient(#6f472c 0 22%, #e7a66d 22% 100%); box-shadow: 0 7px 0 #323650;
    }
    .steve-head::before {
      content: ''; position: absolute; top: 25px; left: 8px; width: 7px; height: 7px; background: #26395b;
      box-shadow: 23px 0 #26395b, 8px 15px #9b4e3f, 15px 15px #9b4e3f;
    }
    .login-field { position: relative; }
    .login-field label {
      position: absolute; left: 14px; top: 12px; color: #18365e; font-size: 8px; font-weight: 700; letter-spacing: 1px;
    }
    .login-field input {
      width: 100%; height: 54px; border: 0; border-radius: 6px; background: #dfe9f0; color: #617089; padding: 24px 14px 7px; font-weight: 600;
    }
    .login-submit {
      width: 150px; height: 54px; border: 0; border-radius: 6px; color: #fff; background: linear-gradient(135deg, #8d4ee0, #7136c8);
      font-weight: 700;
    }
    .login-bottom {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; padding: 22px 30px 28px; background: #f6f9fb; border-top: 1px solid #edf1f5;
    }
    .launcher-guide { color: #586b86; font-size: 12px; }
    .login-error { min-height: 18px; color: var(--danger); font-size: 12px; text-align: right; }
    .site-footer { margin-top: auto; color: #aebbd7; background: #20385f; }
    .footer-top { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 25px 6vw; background: #fff; color: #18365e; }
    .footer-links, .footer-payments { display: flex; align-items: center; flex-wrap: wrap; gap: 22px; }
    .footer-links a, .footer-payments span { color: inherit; font-size: 11px; font-weight: 700; letter-spacing: .7px; text-decoration: none; text-transform: uppercase; }
    .footer-links a:hover { color: var(--purple); }
    .payment-label { color: #71809b !important; }
    .payment-chip { padding: 7px 10px; border: 1px solid #dce3ee; border-radius: 6px; color: #526581 !important; background: #f7f9fc; }
    .payment-chip.logo-chip { display: inline-flex; align-items: center; gap: 6px; }
    .payment-chip img { width: 17px; height: 17px; display: block; object-fit: contain; }
    .footer-bottom { padding: 42px 6vw 28px; }
    .footer-nav { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 42px; }
    .footer-nav a { color: #aebbd7; font-size: 11px; font-weight: 700; letter-spacing: .7px; text-decoration: none; text-transform: uppercase; }
    .footer-nav a:hover, .footer-social a:hover { color: #fff; }
    .footer-details { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .footer-copy, .footer-credit { margin: 0; color: #8fa1c2; font-size: 11px; line-height: 1.5; }
    .footer-credit { color: #c0cbe0; font-weight: 600; }
    .footer-heart { color: #ff87b8; }
    .footer-social { display: flex; gap: 10px; }
    .footer-social a { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: #aebbd7; background: #31496f; text-decoration: none; }
    .footer-social img { width: 15px; height: 15px; display: block; }
    .footer-top + .footer-bottom { border-top: 1px solid rgba(174, 187, 215, .12); }
    .cookie-banner {
      position: fixed; right: 22px; bottom: 22px; z-index: 60; width: min(430px, calc(100vw - 32px)); padding: 20px;
      border: 1px solid #e4d9f4; border-radius: 14px; background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 16px 42px rgba(59, 33, 109, 0.2); backdrop-filter: blur(14px);
    }
    .cookie-banner[hidden] { display: none; }
    .cookie-banner h2 { margin: 0 0 7px; color: var(--dark-purple); font-family: 'Space Grotesk', sans-serif; font-size: 16px; }
    .cookie-banner p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .cookie-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 16px; }
    .cookie-actions button { border: 0; border-radius: 8px; padding: 9px 14px; font-size: 12px; font-weight: 700; }
    .cookie-decline { color: #6f6981; background: #f2eef7; }
    .cookie-accept { color: #fff; background: linear-gradient(135deg, #9d6be0, #7136c8); box-shadow: 0 6px 14px rgba(113, 54, 200, 0.25); }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 800px) {
      .sidebar { width: 190px; }

      .promo-mark { display: none; }

      .product-grid { grid-template-columns: 1fr; gap: 16px; }

      .login-bottom { grid-template-columns: 1fr; }
      .login-error { text-align: left; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <aside class="cookie-banner" id="cookie-banner" role="dialog" aria-label="Cookie consent" hidden>
    <h2>Cookie preferences</h2>
    <p>We use essential browser storage to remember your cart and preferences. Choose whether to allow this storage.</p>
    <div class="cookie-actions">
      <button class="cookie-decline" id="cookie-decline" type="button">Decline</button>
      <button class="cookie-accept" id="cookie-accept" type="button">Accept</button>
    </div>
  </aside>

  <script>
    const products = [
      { id: 1, category: 'ranks', name: 'Mush Rank', description: 'A friendly entry rank with a bright name and starter perks.', price: 899, icon: '✦', iconImage: 'assets/MushRankIcon.jpeg', image: 'assets/Mush-Rank.jpeg', nameplateImage: 'assets/Mush-Rank.jpeg', tone: 'mint' },
      { id: 2, category: 'ranks', name: 'Grand Rank', description: 'More visibility, more perks, and a name that stands out.', price: 599, icon: '✹', iconImage: 'assets/GrandRankIcon.jpeg', image: 'assets/Grand-Rank.jpeg', nameplateImage: 'assets/Grand-Rank.jpeg', tone: 'pink' },
      { id: 3, category: 'ranks', name: 'Apex Rank', description: 'The premium rank for dedicated Mushland adventurers.', price: 299, icon: '☾', iconImage: 'assets/ApexRankIcon.jpeg', image: 'assets/Apex-Rank.jpeg', nameplateImage: 'assets/Apex-Rank.jpeg', tone: 'blue' }
    ];

    const CART_STORAGE_KEY = 'mushlandCart';
    const cartProductLookup = new Map(products.map((product) => [product.id, product]));
    let activeCategory = 'ranks';
    let playerName = localStorage.getItem('mushlandPlayer') || '';
    let cart = loadCart();
    let cartOpen = false;
    let checkoutMode = 'cart';
    let orderSummary = null;

    function formatMoney(value) {
      return `₹${Number(value || 0).toFixed(2)}`;
    }

    function createOrderNumber() {
      return `MUSHLAND-${Date.now().toString().slice(-6)}`;
    }


    function openCartDrawer() {
      cartOpen = true;
      checkoutMode = 'cart';
    }

    function closeCartDrawer() {
      cartOpen = false;
      checkoutMode = 'cart';
    }

    function loadCart() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.filter((item) => Number.isInteger(item.id) && Number(item.quantity) > 0) : [];
      } catch (error) {
        return [];
      }
    }

    function persistCart() {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      window.MushlandCart = buildCartPayload();
    }

    function buildCartPayload() {
      const items = cart
        .map((entry) => {
          const product = cartProductLookup.get(entry.id);
          if (!product) return null;
          const quantity = Number(entry.quantity);
          const unitPrice = Number(product.price);
          const lineTotal = Number((unitPrice * quantity).toFixed(2));
          return {
            productId: product.id,
            name: product.name,
            category: product.category,
            quantity,
            unitPrice,
            lineTotal
          };
        })
        .filter(Boolean);

      return {
        user: playerName || null,
        itemCount: items.reduce((sum, item) => sum + item.quantity, 0),
        subtotal: Number(items.reduce((sum, item) => sum + item.lineTotal, 0).toFixed(2)),
        currency: 'INR',
        items
      };
    }

    function getCartDisplay() {
      return cart
        .map((entry) => {
          const product = cartProductLookup.get(entry.id);
          if (!product) return null;
          const quantity = Number(entry.quantity);
          return {
            ...product,
            quantity,
            lineTotal: Number((product.price * quantity).toFixed(2))
          };
        })
        .filter(Boolean);
    }

    function addToCart(productId, quantity = 1) {
      const product = cartProductLookup.get(productId);
      if (!product) return;

      const existing = cart.find((item) => item.id === productId);
      if (existing) {
        existing.quantity += quantity;
      } else {
        cart.push({ id: productId, quantity });
      }

      persistCart();
      render();
    }

    function updateCartQuantity(productId, quantity) {
      const safeQty = Number(quantity);
      if (!Number.isFinite(safeQty)) return;

      const index = cart.findIndex((item) => item.id === productId);
      if (index === -1) return;

      if (safeQty <= 0) {
        cart.splice(index, 1);
      } else {
        cart[index].quantity = safeQty;
      }

      persistCart();
      render();
    }

    function removeFromCart(productId) {
      cart = cart.filter((item) => item.id !== productId);
      persistCart();
      render();
    }

    function clearCart() {
      cart = [];
      persistCart();
      render();
    }

    async function getPlayerSkinUrl() {
      if (!playerName) return 'assets/guest-skin.png';
      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          const skinResponse = await fetch(`/api/skin/${encodeURIComponent(playerName)}`, { cache: 'no-store' });
          if (skinResponse.ok) {
            const skinData = await skinResponse.json();
            if (skinData.skinUrl) return skinData.skinUrl;
          }
        } catch {
        }
        await new Promise((resolve) => setTimeout(resolve, 500 * (attempt + 1)));
      }
      return 'assets/guest-skin.png';
    }

    async function setupSkinViewer() {
      if (!window.skinview3d) return;

      const skinUrl = await getPlayerSkinUrl();
      const viewerTargets = [
        { canvas: document.querySelector('#skin-viewer'), preview: document.querySelector('.player-preview'), width: 108, height: 132 },
        { canvas: document.querySelector('#login-skin-viewer'), preview: document.querySelector('.login-avatar'), width: 90, height: 110 }
      ].filter((target) => target.canvas && target.preview);

      viewerTargets.forEach(async ({ canvas, preview, width, height }) => {
        try {
          const viewer = new skinview3d.SkinViewer({ canvas, width, height, skin: 'assets/guest-skin.png' });
          viewer.controls.enableZoom = false;
          viewer.controls.enableRotate = false;
          viewer.autoRotate = true;
          viewer.autoRotateSpeed = 0.5;
          viewer.camera.position.y = 0.8;

          await viewer.loadSkin(skinUrl);
          preview.classList.remove('fallback');
        } catch (error) {
          preview.classList.add('fallback');
        }
      });
    }

    function render() {
      const visible = products.filter((product) => product.category === activeCategory);
      const displayCart = getCartDisplay();
      const subtotal = displayCart.reduce((sum, item) => sum + item.lineTotal, 0);
      const totalItems = displayCart.reduce((sum, item) => sum + item.quantity, 0);

      document.querySelector('#app').innerHTML = `
        <aside class="sidebar">
          <div class="profile"><img class="logo-image logo-avatar" src="assets/Logo.Mushland.webp" alt="Mushland logo"></div>
          <div class="side-rule"></div>
          <p class="menu-label">STORE</p>
          <nav class="nav-list">
            <button class="nav-item ${activeCategory === 'ranks' ? 'active' : ''}" data-category="ranks" type="button"><span class="nav-icon"><img class="nav-icon-image" src="assets/Catogory-Rank.jpeg" alt="Ranks"></span>Ranks</button>
            <button class="nav-item ${activeCategory === 'gems' ? 'active' : ''}" data-category="gems" type="button"><span class="nav-icon">◆</span>Gems</button>
          </nav>

          <div class="sidebar-player">
            <div class="player-preview ${playerName ? '' : 'fallback'}">
              <canvas id="skin-viewer" width="108" height="132" aria-label="3D player skin preview"></canvas>
              <span class="skin-fallback">S</span>
            </div>
            <button class="user-button" type="button">${playerName || 'Guest player'}</button>
            <div class="account-menu" ${playerName ? '' : 'hidden'}>
              <p>${playerName || 'Guest player'}</p>
              <button class="logout-button" type="button">Log out</button>
            </div>
          </div>

          <a class="sidebar-note" href="https://discord.gg/XYa5jjCwAN" target="_blank" rel="noopener noreferrer">
            <span class="sparkle">✦</span>
            <div><strong>Need help?</strong><small>Join our Discord</small></div>
          </a>
        </aside>

        <main class="storefront">
          <div class="promo"><span class="promo-mark">✦</span><span><strong>Bedwars Beta Is Live</strong> &nbsp; Join With <strong>Beta.Mushland.In</strong></span><span class="promo-mark">✦</span></div>

          <section class="content">
            <div class="page-heading">
              <div>
                <h1>${activeCategory === 'ranks' ? 'Ranks' : 'Gems'}</h1>
              </div>
              <div class="online"><span></span> Server online</div>
            </div>

            <div class="product-grid">
              ${activeCategory === 'gems' ? '<div class="coming-soon">Coming soon!</div>' : visible.map((product, index) => `
                <article class="product-card ${product.category === 'ranks' ? 'rank-card' : ''}" data-preview-image="${product.image || ''}" style="animation-delay: ${index * 80}ms;">
                  <div class="product-art ${product.tone}">
                    <div class="pixel-sun"></div>
                    ${product.category === 'ranks' ? `<div class="rank-icon-circle"><img class="rank-icon-image" src="${product.iconImage}" alt="${product.name} icon"></div>` : product.image ? `<img class="rank-art-image" src="${product.image}" alt="${product.name} badge">` : `<div class="pixel-mushroom">${product.icon}</div>`}
                    <span class="art-label">MUSHLAND</span>
                  </div>
                  <div class="product-info">
                    <h2>${product.name}</h2>
                    <p>${product.description}</p>
                    ${product.nameplateImage ? `<div class="rank-nameplate-preview"><span>Special Nameplate</span><img src="${product.nameplateImage}" alt="${product.name} special nameplate preview"></div>` : ''}
                    <div class="card-bottom">
                      <strong>${formatMoney(product.price)}</strong>
                      <button class="add-button" type="button" data-add="${product.id}" aria-label="Add ${product.name}">+</button>
                    </div>
                  </div>
                </article>
              `).join('')}
            </div>
          </section>

          <footer class="site-footer">
            <div class="footer-top">
              <nav class="footer-links" aria-label="Store information">
                <a href="https://discord.gg/XYa5jjCwAN" target="_blank" rel="noopener noreferrer">Store Support</a>
                <a href="terms.html">Terms &amp; Conditions</a>
                <a href="privacy.html">Privacy Notice</a>
                <a href="cookie-policy.html">Cookie Policy</a>
                <a href="refund-policy.html">Refund Policy</a>
              </nav>
              <div class="footer-payments" aria-label="Payment methods">
                <span class="payment-label">Payment methods</span>
                <span class="payment-chip logo-chip"><img src="https://cdn.simpleicons.org/razorpay/526581" alt="Razorpay">Razorpay</span>
                <span class="payment-chip logo-chip"><img src="https://cdn.simpleicons.org/upi/526581" alt="UPI">UPI</span>
                <span class="payment-chip">Cards</span>
                <span class="payment-chip">Netbanking</span>
              </div>
            </div>
            <div class="footer-bottom">
              <nav class="footer-nav" aria-label="Footer navigation">
                <a href="https://discord.gg/XYa5jjCwAN" target="_blank" rel="noopener noreferrer">Discord</a>
                <a href="#help">Help &amp; FAQ</a>
                <a href="#support">Support</a>
                <div class="footer-social" aria-label="Social media">
                  <a href="#youtube" aria-label="YouTube"><img src="https://cdn.simpleicons.org/youtube/ffffff" alt=""></a>
                  <a href="#instagram" aria-label="Instagram"><img src="https://cdn.simpleicons.org/instagram/ffffff" alt=""></a>
                  <a href="https://discord.gg/XYa5jjCwAN" target="_blank" rel="noopener noreferrer" aria-label="Discord"><img src="https://cdn.simpleicons.org/discord/ffffff" alt=""></a>
                </div>
              </nav>
              <div class="footer-details">
                <p class="footer-copy">&copy; 2026 Mushland Online Ltd. All Rights Reserved. Not an official Minecraft product. Not approved by or associated with Mojang.</p>
                <p class="footer-credit">Made with <span class="footer-heart">&hearts;</span> by Krown</p>
              </div>
            </div>
          </footer>
        </main>

        <footer class="cart-bar">
          <div class="cart-total">
            <span class="cart-icon">🛒</span>
            <div>
              <small>YOUR CART</small>
              <strong>${totalItems} ${totalItems === 1 ? 'item' : 'items'}</strong>
            </div>
          </div>
          <div class="total-price">
            <small>TOTAL</small>
            <strong>${formatMoney(subtotal)}</strong>
          </div>
          <button class="checkout-button" type="button" ${displayCart.length ? '' : 'disabled'}>View cart →</button>
        </footer>

        <div class="cart-drawer" hidden>
          <section class="cart-panel">
            <div class="cart-heading">
              <h2>${checkoutMode === 'checkout' ? 'Checkout' : 'Your cart'}</h2>
              <button class="cart-close" type="button" aria-label="Close cart">×</button>
            </div>

            ${checkoutMode === 'checkout' && displayCart.length ? `
              <form class="cart-items" id="checkout-form">
                <div class="checkout-summary">
                  <div class="checkout-row"><span>Account</span><strong>${playerName || 'Guest'}</strong></div>
                  ${displayCart.map((item) => `
                    <div class="checkout-row"><span>${item.name} × ${item.quantity}</span><strong>${formatMoney(item.lineTotal)}</strong></div>
                  `).join('')}
                  <div class="checkout-total-row"><span>Total</span><strong>${formatMoney(subtotal)}</strong></div>
                </div>

                <div class="checkout-form">
                  <div class="checkout-field">
                    <label for="checkout-player">Minecraft username</label>
                    <input id="checkout-player" name="playerName" value="${playerName}" maxlength="16" required>
                  </div>
                  <div class="checkout-field">
                    <label for="checkout-email">Email (optional)</label>
                    <input id="checkout-email" name="email" type="email" placeholder="you@example.com">
                  </div>
                </div>

                <div class="checkout-actions">
                  <button class="checkout-back" type="button">Back</button>
                  <button class="checkout-submit" type="submit">Pay now</button>
                </div>
                <p class="checkout-error" aria-live="polite"></p>
              </form>
            ` : `
              <div class="cart-items">
                ${displayCart.length ? displayCart.map((item) => `
                  <div class="cart-item">
                    <div class="cart-item-art ${item.tone}">${item.iconImage ? `<img class="rank-icon-image" src="${item.iconImage}" alt="${item.name} icon">` : item.icon}</div>
                    <div>
                      <h3>${item.name}</h3>
                      <span class="cart-item-price">${formatMoney(item.lineTotal)}</span>
                      <div class="quantity-controls">
                        <button type="button" data-decrease="${item.id}" aria-label="Decrease quantity">−</button>
                        <span>${item.quantity}</span>
                        <button type="button" data-increase="${item.id}" aria-label="Increase quantity">+</button>
                      </div>
                    </div>
                    <button class="remove-item" type="button" data-remove="${item.id}">Remove</button>
                  </div>
                `).join('') : '<div class="cart-empty">Your cart is empty.</div>'}
              </div>

              <div class="cart-footer">
                <div class="cart-footer-row"><span>Subtotal</span><strong>${formatMoney(subtotal)}</strong></div>
                <button class="clear-cart" type="button">Clear cart</button>
                ${displayCart.length ? '<button class="checkout-start" type="button" style="width:100%; margin-top:12px;">Continue to checkout</button>' : ''}
              </div>
            `}
          </section>
        </div>

        <div class="checkout-success-modal" hidden>
          <div class="checkout-success-panel">
            <div class="success-icon">✓</div>
            <h2>Order placed</h2>
            <p>Your order request has been saved. Join our Discord to arrange fulfilment.</p>
            <div class="success-summary">
              <div class="success-row"><span>Order</span><strong>${orderSummary?.orderId || '—'}</strong></div>
              <div class="success-row"><span>Player</span><strong>${orderSummary?.playerName || '—'}</strong></div>
              <div class="success-row"><span>Total</span><strong>${formatMoney(orderSummary?.total || 0)}</strong></div>
            </div>
            <button class="success-close" type="button">Close</button>
          </div>
        </div>

        <div class="login-modal" hidden>
          <form class="login-panel" id="login-form">
            <div class="login-top">
              <h2>Login with your Minecraft name</h2>
              <button class="login-close" type="button" aria-label="Close login">×</button>
              <div class="login-avatar"><canvas id="login-skin-viewer" width="90" height="110" aria-label="3D login skin preview"></canvas></div>
              <div class="login-field">
                <label for="player-name">Username</label>
                <input id="player-name" name="playerName" value="${playerName}" placeholder="Steve" maxlength="16">
              </div>
              <button class="login-submit" type="submit">Continue</button>
            </div>
            <div class="login-bottom">
              <div class="launcher-guide">Use the name linked to your account to load your skin in the preview.</div>
              <div class="login-error" aria-live="polite"></div>
            </div>
          </form>
        </div>
      `;

      const cartDrawer = document.querySelector('.cart-drawer');
      if (cartDrawer) {
        cartDrawer.hidden = !cartOpen;
      }

      const successModal = document.querySelector('.checkout-success-modal');
      if (successModal) {
        successModal.hidden = !orderSummary;
      }

      const loginModal = document.querySelector('.login-modal');
      const loginForm = document.querySelector('#login-form');
      const loginInput = document.querySelector('#player-name');
      const loginError = document.querySelector('.login-error');

      document.querySelectorAll('[data-category]').forEach((button) => {
        button.addEventListener('click', () => {
          activeCategory = button.dataset.category;
          render();
        });
      });

      document.querySelectorAll('[data-add]').forEach((button) => {
        button.addEventListener('click', () => addToCart(Number(button.dataset.add), 1));
      });

      document.querySelectorAll('[data-increase]').forEach((button) => {
        button.addEventListener('click', () => {
          addToCart(Number(button.dataset.increase), 1);
          if (cartDrawer) cartDrawer.hidden = false;
        });
      });

      document.querySelectorAll('[data-decrease]').forEach((button) => {
        button.addEventListener('click', () => {
          const productId = Number(button.dataset.decrease);
          const item = cart.find((entry) => entry.id === productId);
          if (!item) return;
          updateCartQuantity(productId, item.quantity - 1);
        });
      });

      document.querySelectorAll('[data-remove]').forEach((button) => {
        button.addEventListener('click', () => removeFromCart(Number(button.dataset.remove)));
      });

      document.querySelector('.checkout-button')?.addEventListener('click', () => {
        if (displayCart.length) {
          openCartDrawer();
          render();
        }
      });

      document.querySelector('.checkout-start')?.addEventListener('click', () => {
        if (displayCart.length) {
          checkoutMode = 'checkout';
          render();
        }
      });

      document.querySelector('.checkout-back')?.addEventListener('click', () => {
        checkoutMode = 'cart';
        render();
      });

      document.querySelector('#checkout-form')?.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!displayCart.length) return;

        const form = event.currentTarget;
        const submitButton = form.querySelector('.checkout-submit');
        const checkoutError = form.querySelector('.checkout-error');
        const formData = new FormData(form);
        const submittedPlayerName = String(formData.get('playerName') || '').trim() || playerName || 'Guest';
        const email = String(formData.get('email') || '').trim();

        if (!submittedPlayerName) {
          return;
        }

        playerName = submittedPlayerName;
        localStorage.setItem('mushlandPlayer', playerName);

        if (submitButton) submitButton.disabled = true;
        if (checkoutError) checkoutError.textContent = '';

        try {
          const orderResponse = await fetch('/api/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              items: buildCartPayload().items,
              playerName,
              email
            })
          });
          const orderData = await orderResponse.json();
          if (!orderResponse.ok) throw new Error(orderData.error || 'Unable to start checkout.');
          if (!window.Razorpay) throw new Error('Razorpay Checkout could not be loaded.');

          const razorpay = new window.Razorpay({
            key: orderData.keyId,
            amount: orderData.amount,
            currency: orderData.currency,
            name: 'Mushland Store',
            description: 'Mushland rank purchase',
            order_id: orderData.orderId,
            prefill: { name: playerName, email },
            method: { upi: true },
            theme: { color: '#7136c8' },
            modal: {
              ondismiss: () => {
                if (submitButton) submitButton.disabled = false;
              }
            },
            handler: async (paymentResponse) => {
              try {
                const verifyResponse = await fetch('/api/verify-payment', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(paymentResponse)
                });
                const verification = await verifyResponse.json();
                if (!verifyResponse.ok || !verification.verified) {
                  throw new Error(verification.error || 'Payment verification failed.');
                }

                orderSummary = {
                  orderId: orderData.orderId,
                  playerName,
                  email,
                  total: orderData.amount / 100
                };
                cart = [];
                persistCart();
                cartOpen = false;
                checkoutMode = 'cart';
                render();
              } catch (error) {
                if (checkoutError) checkoutError.textContent = error.message || 'Payment verification failed.';
                if (submitButton) submitButton.disabled = false;
              }
            }
          });

          razorpay.on('payment.failed', (paymentError) => {
            if (checkoutError) checkoutError.textContent = paymentError.error?.description || 'Payment was not completed.';
            if (submitButton) submitButton.disabled = false;
          });
          razorpay.open();
        } catch (error) {
          if (checkoutError) checkoutError.textContent = error.message || 'Unable to start checkout.';
          if (submitButton) submitButton.disabled = false;
        }
      });

      document.querySelector('.cart-close')?.addEventListener('click', () => {
        closeCartDrawer();
        render();
      });

      if (cartDrawer) {
        cartDrawer.addEventListener('click', (event) => {
          if (event.target === cartDrawer) {
            closeCartDrawer();
            render();
          }
        });
      }

      document.querySelector('.clear-cart')?.addEventListener('click', () => clearCart());
      document.querySelector('.success-close')?.addEventListener('click', () => {
        orderSummary = null;
        render();
      });

      document.querySelector('.user-button')?.addEventListener('click', () => {
        if (playerName) {
          const menu = document.querySelector('.account-menu');
          if (menu) menu.hidden = !menu.hidden;
          return;
        }

        if (loginModal) loginModal.hidden = false;
        loginInput?.focus();
      });

      document.querySelector('.logout-button')?.addEventListener('click', () => {
        playerName = '';
        localStorage.removeItem('mushlandPlayer');
        const menu = document.querySelector('.account-menu');
        if (menu) menu.hidden = true;
        render();
      });

      document.querySelector('.login-close')?.addEventListener('click', () => {
        if (loginModal) loginModal.hidden = true;
        if (loginError) loginError.textContent = '';
      });

      if (loginModal) {
        loginModal.addEventListener('click', (event) => {
          if (event.target === loginModal) {
            loginModal.hidden = true;
            if (loginError) loginError.textContent = '';
          }
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const nextName = loginInput.value.trim();

          if (!nextName) {
            if (loginError) loginError.textContent = 'Please enter a player name.';
            return;
          }

          playerName = nextName;
          localStorage.setItem('mushlandPlayer', playerName);
          if (loginError) loginError.textContent = '';
          if (loginModal) loginModal.hidden = true;
          render();
        });
      }

      setupSkinViewer();
    }

    persistCart();
    render();

    const cookieConsentKey = 'mushlandCookieConsent';
    const cookieBanner = document.querySelector('#cookie-banner');
    const savedCookieConsent = localStorage.getItem(cookieConsentKey);

    if (!savedCookieConsent) {
      cookieBanner.hidden = false;
    }

    document.querySelector('#cookie-accept')?.addEventListener('click', () => {
      localStorage.setItem(cookieConsentKey, 'accepted');
      cookieBanner.hidden = true;
    });

    document.querySelector('#cookie-decline')?.addEventListener('click', () => {
      localStorage.setItem(cookieConsentKey, 'declined');
      cookieBanner.hidden = true;
    });
  </script>
</body>
</html>
